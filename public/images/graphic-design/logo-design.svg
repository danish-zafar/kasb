<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>
  <circle cx="500" cy="80" r="120" fill="#ec4899" opacity="0.15" filter="blur(20px)"/>
  <circle cx="100" cy="320" r="100" fill="#8b5cf6" opacity="0.2" filter="blur(20px)"/>

  <g transform="translate(300, 150)" text-anchor="middle">
    <!-- Geometric Logo Mark -->
    <polygon points="0,-60 50,30 -50,30" fill="url(#brand)" opacity="0.9"/>
    <circle cx="0" cy="-10" r="20" fill="#fbbf24"/>
  </g>

  <text x="300" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28">Logo Design &amp; Brand Identity</text>
  <text x="300" y="310" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="600" font-size="16">Clean, Modern &amp; Vector Logos</text>
</svg>
