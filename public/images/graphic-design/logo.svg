  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.6"/>

  <!-- Creative Design Symbol -->
