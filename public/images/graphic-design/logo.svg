    <path d="M-40,-30 C-40,-60 0,-70 40,-30 C70,0 50,50 10,50 C-10,50 -10,30 -25,30 C-40,30 -40,0 -40,-30 Z" fill="url(#accentGrad)" opacity="0.9"/>
    <circle cx="-15" cy="-25" r="8" fill="#ffffff"/>
    <circle cx="15" cy="-25" r="8" fill="#fbbf24"/>
    <circle cx="30" cy="5" r="8" fill="#38bdf8"/>
    <circle cx="-20" cy="5" r="6" fill="#ec4899"/>
  </g>

  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="1">JAWERIA DESIGNER</text>
  <text x="200" y="300" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="2">GRAPHIC DESIGNER</text>
  <text x="200" y="330" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="600" font-size="14">SADIQABAD • 0306 2635726</text>
  <text x="200" y="355" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="11">Creative &amp; Professional Visual Branding</text>
