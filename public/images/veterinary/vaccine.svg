<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c54"/>
      <stop offset="50%" stop-color="#058A39"/>
      <stop offset="100%" stop-color="#011429"/>
    </linearGradient>
    <linearGradient id="vSyringe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#vBg)"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.25"/>

  <!-- Decorative Grid / Glow -->
  <circle cx="300" cy="150" r="110" fill="#34d399" opacity="0.08"/>
  <circle cx="300" cy="150" r="75" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Syringe & Shield Illustration -->
  <g transform="translate(300, 150)">
    <!-- Shield -->
    <path d="M-45,-55 C-15,-65 15,-65 45,-55 C45,15 25,55 0,70 C-25,55 -45,15 -45,-55 Z" fill="#04702e" stroke="#34d399" stroke-width="4" opacity="0.85"/>
    <path d="M-30,-42 C-10,-50 10,-50 30,-42 C30,10 15,40 0,52 C-15,40 -30,10 -30,-42 Z" fill="#022c54" opacity="0.6"/>
    <!-- Cross icon -->
    <path d="M-12,-10 H12 V-22 H-12 Z M-12,10 H12 V22 H-12 Z M-22,-12 V12 H-10 V-12 Z M10,-12 V12 H22 V-12 Z" fill="#fbbf24"/>
    <!-- Syringe graphic -->
    <g transform="rotate(-35) translate(-10, -10)">
      <rect x="-8" y="-50" width="16" height="60" rx="4" fill="url(#vSyringe)"/>
      <rect x="-5" y="-40" width="10" height="35" rx="2" fill="#34d399" opacity="0.8"/>
      <path d="M-2,-50 L-2,-65 H2 L2,-50 Z" fill="#94a3b8"/>
      <line x1="0" y1="-65" x2="0" y2="-80" stroke="#f8fafc" stroke-width="3"/>
      <rect x="-14" y="10" width="28" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="-3" y="16" width="6" height="25" fill="#cbd5e1"/>
      <rect x="-10" y="41" width="20" height="5" rx="2" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="290" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">Pet Animal Vaccination &amp; Health Care</text>
  <text x="300" y="322" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14">Anti-Rabies • Hair Fall • Internal Worms • Ticks &amp; Mites</text>
  <text x="300" y="348" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">Low Prices From Market Rates • Daharki</text>
</svg>