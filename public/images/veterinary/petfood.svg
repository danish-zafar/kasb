<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#fBg)"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>

  <!-- Background Decorative Rings -->
  <circle cx="300" cy="145" r="105" fill="#38bdf8" opacity="0.08"/>
  <circle cx="300" cy="145" r="75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Pet Bowl & Paw Graphics -->
  <g transform="translate(300, 145)">
    <!-- Food Bowl Base -->
    <path d="M-60,20 L60,20 L48,50 C45,58 -45,58 -48,50 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <ellipse cx="0" cy="20" rx="60" ry="14" fill="#38bdf8"/>
    <ellipse cx="0" cy="18" rx="52" ry="10" fill="#022c54"/>
    <!-- Food Pellets inside bowl -->
    <circle cx="-25" cy="16" r="5" fill="#f59e0b"/>
    <circle cx="-10" cy="13" r="6" fill="#d97706"/>
    <circle cx="8" cy="15" r="5.5" fill="#f59e0b"/>
    <circle cx="24" cy="17" r="5" fill="#b45309"/>
    <circle cx="0" cy="19" r="4.5" fill="#f59e0b"/>

    <!-- Large Paw Icon above Bowl -->
    <g transform="translate(0, -35)">
      <!-- Main Pad -->
      <path d="M-22,12 C-22,0 22,0 22,12 C22,24 -22,24 -22,12 Z" fill="#f8fafc"/>
      <!-- Toe Pads -->
      <circle cx="-24" cy="-12" r="8" fill="#f8fafc"/>
      <circle cx="-8" cy="-22" r="8.5" fill="#f8fafc"/>
      <circle cx="8" cy="-22" r="8.5" fill="#f8fafc"/>
      <circle cx="24" cy="-12" r="8" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="290" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">Processed Hygiene Food For Pets</text>
  <text x="300" y="322" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15">Specially Formulated For Cats &amp; Dogs 🐱 🐶</text>
  <text x="300" y="348" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">High Quality • Nutritious • Hygiene Assured</text>
</svg>